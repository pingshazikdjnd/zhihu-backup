name = "gemini-zhihu-api"
main = "src/index.ts"
compatibility_date = "2024-02-23"
compatibility_flags = ["nodejs_compat"]

# ⚠️ 部署前必须替换：运行 `npx wrangler d1 create zhihu-backup`，
#    把输出的 UUID（注意是 D1 库的 uuid，不是 account id）填到下面。
#    全零 UUID 是模板占位符，deploy 不会报错但所有查询都会失败。
[[d1_databases]]
binding = "DB"
database_name = "zhihu-backup"
database_id = "bbb2772e-3921-4d73-8423-9e3eceda1157"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zhihu-backup-storage"

[ai]
binding = "AI"

[vars]
# Apify Actor / 爬虫把数据 POST 回来的地址：
# 生产环境使用 Pages 域名（通过 Pages 的 _worker.js 转发到 Worker，绕开国内对 *.workers.dev 的 DNS 污染）。
# ⚠️ wrangler deploy 以本文件为准：这里没写的明文变量会在部署时被清掉（除非加 --keep-vars），
# 所以 WORKER_URL 必须保留在此处。值取自下方 ALLOWED_ORIGIN 里的 Pages 域名；
# 若你换了域名/用了自定义域名，请同步修改这一行（不要再填 *.workers.dev）。
WORKER_URL = "https://zhihu-backup.pages.dev"

# 你的知乎 url_token（个人主页 /people/<token> 里的那段）
ZHIHU_USERNAME = "yang-xu-heng-94"

# 前端域名白名单（CORS）。必须填真实域名，否则浏览器跨域请求会被拦截。
# 多个域名用英文逗号分隔，如 "https://zhihu-backup.pages.dev,https://your-custom-domain.com"。
# 支持 *.pages.dev 通配，如果使用自定义域名请务必加入白名单。留空 = 只放行 localhost（本地开发）。
# Pages 前端走同源 _worker.js 转发时不受 CORS 限制，但跨域直接请求 Worker 时必须在此放行。
ALLOWED_ORIGIN = "https://zhihu-backup.pages.dev"

# 云端 Apify 已停用：镜像为旧代码，且与本地 08:05/20:05 任务并发双写。
# 必须用空数组才能移除已部署的 cron（只注释掉该段不会删除）。
# 重新启用时改回 ["0 2,14 * * *"] 并重新部署 Actor。
[triggers]
crons = []

# 以下四项不要写在这里，用 secret 注入：
#   npx wrangler secret put API_SECRET
#   npx wrangler secret put APIFY_TOKEN
#   npx wrangler secret put APIFY_ACTOR_ID
#   npx wrangler secret put ZHIHU_COOKIE_STRING

# 可选：给网页的「粘贴 cookie」表单加一道口令。
# 不配置 = 网页打开就能直接提交（方便，但知道域名的人也能覆盖你的 cookie）。
# 配置后 = 网页会提示填一次，填完记在 localStorage。
#   npx wrangler secret put COOKIE_WRITE_TOKEN
